    <style>
        body {
            background-color: #ffffff !important;
            margin: 0;
            padding: 0;
        }

        /* SVG text optimizations */
        svg text {
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* Animación de flotación sutil para los íconos */
        @keyframes subtleFloating {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-5px);
            }
        }

        .icon-subtle-float {
            animation: subtleFloating 3.2s ease-in-out infinite;
            transform-origin: center;
            transform-box: fill-box;
            will-change: transform;
        }

        /* Desfase orgánico para cada ícono */
        .delay-0 { animation-delay: 0s; }
        .delay-1 { animation-delay: 0.35s; }
        .delay-2 { animation-delay: 0.7s; }
        .delay-3 { animation-delay: 1.05s; }
        .delay-4 { animation-delay: 1.4s; }
        .delay-5 { animation-delay: 1.75s; }
        .delay-6 { animation-delay: 2.1s; }
        .delay-7 { animation-delay: 2.45s; }
        .delay-8 { animation-delay: 2.8s; }

        /* Estilo estático para los botones de más (+) sin animación */
        .btn-plus {
            cursor: pointer;
            transform-origin: center;
            transform-box: fill-box;
            transition: opacity 0.2s ease, filter 0.2s ease;
        }

        .btn-plus:hover {
            filter: drop-shadow(0 2px 5px rgba(4, 99, 81, 0.3));
        }

        .btn-plus circle {
            transition: fill 0.25s ease, stroke 0.25s ease;
        }

        .btn-plus:hover circle {
            fill: #00a095;
        }

        /* Estado al hacer clic: cambio de color permanente a verde claro distintivo */
        .btn-plus.btn-clicked circle {
            fill: #00cc6f !important;
            stroke: #046351;
            stroke-width: 1.2;
        }

        .btn-plus.btn-clicked:hover circle {
            fill: #7ddf87 !important;
        }

        /* Estilo para el botón de más información */
        .btn-more-info {
            cursor: pointer;
            transition: filter 0.2s ease, opacity 0.2s ease;
        }

        .btn-more-info:hover {
            filter: drop-shadow(0 2px 6px rgba(4, 99, 81, 0.4));
        }

        .btn-more-info:hover rect {
            fill: #057a64;
        }
    </style>
</head>

                    <g class="icon-subtle-float delay-7" id="g-root-ic_sign_13z8u831qt02z2-stroke" data-item-order="0">
                        <g id="ic_sign_13z8u831qt02z2-stroke">
                            <path class="st88" d="M855.36,190.56h-20c-1.1,0-2-.9-2-2v-42c0-1.1.9-2,2-2h26.59c.53,0,1.04.21,1.41.59l7.41,7.41c.38.37.59.88.59,1.41v4.59M851.31,174.56c-5.07-.03-9.32-3.85-9.89-8.89-.56-5.04,2.74-9.71,7.68-10.85,4.94-1.15,9.96,1.59,11.67,6.37M851.36,158.56v6h4M864.98,177.62c0,1.59,1.29,2.87,2.87,2.87s2.87-1.29,2.87-2.87-1.29-2.87-2.87-2.87-2.87,1.29-2.87,2.87ZM870.3,166.5l.85,2.78c.29.96,1.27,1.53,2.25,1.31l2.82-.65c1.1-.25,2.23.25,2.79,1.23.56.98.42,2.2-.35,3.03l-1.98,2.13c-.68.74-.68,1.87,0,2.61l1.98,2.13c.77.82.91,2.05.35,3.03-.56.98-1.69,1.47-2.79,1.23l-2.82-.65c-.97-.22-1.95.35-2.24,1.3l-.85,2.78c-.32,1.08-1.32,1.82-2.44,1.82s-2.12-.74-2.44-1.82l-.86-2.78c-.29-.96-1.27-1.53-2.25-1.31l-2.82.65c-1.1.25-2.23-.25-2.79-1.23-.56-.98-.42-2.2.35-3.03l1.98-2.13c.68-.74.68-1.87,0-2.61l-1.98-2.13c-.77-.82-.91-2.05-.35-3.03.56-.98,1.69-1.47,2.79-1.23l2.82.65c.98.22,1.96-.35,2.25-1.31l.85-2.78c.32-1.08,1.32-1.82,2.44-1.81,1.13,0,2.12.74,2.44,1.82Z"/>

                    <!-- D8: Ícono Trofeo / Cierre con flotación sutil -->

                        <g id="ic_trop_hxrldv1qt02dg-stroke">

    </main>

    <!-- Modal informativo discreto al hacer clic en el botón de más (+) -->
    <div id="step-modal-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 opacity-0 pointer-events-none transition-opacity duration-200 flex items-center justify-center p-4">
        <div id="step-modal-card" class="bg-white rounded-2xl max-w-xl w-full p-6 sm:p-7 shadow-2xl border border-slate-100 transform scale-95 transition-transform duration-200 relative">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <div class="flex items-center space-x-2.5">
                    <span id="modal-badge" class="px-2.5 py-0.5 rounded-md bg-emerald-100 text-emerald-800 font-bold text-xs">D0</span>
                    <h3 id="modal-title" class="font-bold text-slate-800 text-base sm:text-lg">Título del paso</h3>
                </div>
                <button onclick="closeStepModal()" aria-label="Cerrar modal" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 hover:text-slate-800 transition flex items-center justify-center text-base font-semibold cursor-pointer">
                    ✕
                </button>
            </div>
            <div id="modal-content" class="pt-4 text-xs sm:text-sm leading-relaxed text-slate-600 space-y-3 max-h-[65vh] overflow-y-auto pr-1">
                <!-- Contenido dinámico -->
            </div>
        </div>
    </div>

    <script>
        const stepDescriptions = {
            "D0": {
                badge: "D0",
                title: "Preparar y planificar",
                paragraphs: [
                    "Se evalúan la emergencia, la severidad, el alcance inicial y la necesidad de iniciar un 8D. También se designa un responsable, se recopilan los datos disponibles y se decide si deben suspenderse entregas. Además, se determina si es necesario activar un protocolo o informar a las partes interesadas.",
                    "D0 evita comenzar una investigación sin proteger primero a las personas o los clientes. La salida mínima incluye una decisión documentada, alcance preliminar, medidas de respuesta inmediata y calendario de comunicación.",
                    "<strong>Nota clave:</strong> No todos los problemas requieren 8D. La preparación también puede concluir que basta una corrección local o un A3."
                ]
            },
            "D1": {
                badge: "D1",
                title: "Formar el equipo",
                paragraphs: [
                    "El equipo debe reunir conocimientos sobre producto, proceso, calidad, mantenimiento, ingeniería, logística y relación con el cliente, según el caso. Cada integrante necesita una función, tiempo asignado y autoridad para obtener información. Se recomienda un grupo manejable con líder y patrocinador. Pueden convocarse especialistas temporales.",
                    "El criterio de salida no es una lista de nombres. Es la confirmación de que están representadas las competencias necesarias. También deben acordarse la frecuencia de reuniones, el repositorio de evidencia, las reglas para decisiones y el mecanismo de escalamiento."
                ]
            },
            "D2": {
                badge: "D2",
                title: "Describir el problema",
                paragraphs: [
                    "La descripción responde qué, dónde, cuándo, quién o qué población, cuánto, cómo se detectó y cuál requisito se incumple. Es útil contrastar “es” y “no es”. Por ejemplo, el defecto aparece en el modelo A, no en el B. También puede ocurrir en el turno nocturno y no en el matutino. Puede haber comenzado después de una modificación sin estar presente en lotes anteriores.",
                    "Esta comparación delimita la investigación y ayuda a identificar diferencias relevantes. La descripción debe actualizarse si surge nueva evidencia, sin sustituir silenciosamente la versión original."
                ]
            },
            "D3": {
                badge: "D3",
                title: "Desarrollar e implementar acciones de contención provisional",
                paragraphs: [
                    "Las acciones protegen al cliente mientras se determina la causa. Pueden incluir inspección al 100 %, bloqueo de inventario, clasificación, cambio temporal de proveedor, respaldo de servicio o comunicación preventiva.",
                    "Cada medida necesita validación, responsable, vigencia, costo y criterio de retiro. Una inspección adicional puede reducir escapes, pero no debe mantenerse indefinidamente. Consume recursos y puede crear una falsa sensación de solución.",
                    "El equipo debe medir su eficacia mediante indicadores. Entre ellos pueden encontrarse piezas revisadas, defectos retenidos, lotes liberados y reclamaciones posteriores."
                ]
            },
            "D4": {
                badge: "D4",
                title: "Identificar y verificar causas raíz y puntos de escape",
                paragraphs: [
                    "La causa de ocurrencia explica por qué se generó el defecto. La causa de escape explica por qué los controles no lo identificaron antes de llegar a la siguiente etapa o al cliente. Ambas son necesarias.",
                    "Una causa se verifica cuando el equipo demuestra que su presencia reproduce el problema. También debe demostrar que su control modifica el resultado, dentro de las posibilidades técnicas. Las herramientas causales generan hipótesis, pero no constituyen por sí mismas la prueba.",
                    "También deben investigarse causas sistémicas, como procedimientos desactualizados y parámetros sin control. Otros ejemplos son cambios de ingeniería mal comunicados o planes de inspección que no reflejan el riesgo real."
                ]
            },
            "D5": {
                badge: "D5",
                title: "Seleccionar y verificar acciones correctivas permanentes",
                paragraphs: [
                    "Las alternativas se evalúan según eficacia, riesgo, costo, plazo, factibilidad, impacto ambiental y posibles efectos secundarios. Verificar una acción significa demostrar, antes de su despliegue general, que puede eliminar la causa sin crear nuevos problemas.",
                    "Puede utilizarse un piloto, una simulación, un lote controlado, una prueba de capacidad o una revisión técnica. La decisión debe conservar evidencia del criterio utilizado. Elegir la acción más rápida o económica sin evaluar su capacidad causal puede provocar recurrencia."
                ]
            },
            "D6": {
                badge: "D6",
                title: "Implementar y validar las acciones permanentes",
                paragraphs: [
                    "La implementación incluye recursos, responsables, fechas, actualización documental y retiro controlado de la contención. La validación se realiza con datos de operación y confirma que el problema no reaparece durante un periodo representativo.",
                    "Conviene evaluar indicadores de resultado y de proceso. Estos pueden incluir tasa de defectos, reclamaciones, estabilidad del parámetro, cumplimiento del nuevo método y desempeño del control. La acción no debe cerrarse solo porque fue instalada. Requiere evidencia de eficacia sostenida."
                ]
            },
            "D7": {
                badge: "D7",
                title: "Prevenir recurrencias",
                paragraphs: [
                    "El aprendizaje se extiende a productos, procesos, plantas o servicios que comparten condiciones semejantes. Se actualizan procedimientos, instrucciones, planes de control, análisis de riesgos, especificaciones, programas de mantenimiento, formación y criterios de auditoría.",
                    "La prevención no significa copiar la misma acción en toda la organización. Implica determinar dónde existe una exposición comparable. Esta disciplina transforma una solución puntual en aprendizaje institucional. También evita que la causa reaparezca bajo otro código o proceso."
                ]
            },
            "D8": {
                badge: "D8",
                title: "Reconocer al equipo y cerrar",
                paragraphs: [
                    "El cierre confirma que las acciones se completaron, la eficacia fue validada y la contención se retiró. También confirma que la documentación se actualizó y que las partes interesadas aceptaron el resultado.",
                    "El reconocimiento identifica las contribuciones del equipo y refuerza la participación futura. No sustituye la revisión crítica de las dificultades. La lección aprendida debe indicar qué señales permitieron detectar el problema y qué supuestos resultaron incorrectos. También debe señalar qué cambios mejoraron la investigación."
                ]
            }
        };

        function openStepModal(stepKey, btnEl) {
            // Cambiar el color del botón al hacer clic de forma permanente
            if (btnEl) {
                btnEl.classList.add('btn-clicked');
            }

            const data = stepDescriptions[stepKey];
            if (!data) return;

            document.getElementById('modal-badge').innerText = data.badge;
            document.getElementById('modal-title').innerText = data.title;
            
            const card = document.getElementById('step-modal-card');
            card.classList.remove('max-w-2xl');
            card.classList.add('max-w-xl');

            const contentContainer = document.getElementById('modal-content');
            contentContainer.innerHTML = data.paragraphs.map(p => `<p>${p}</p>`).join('');

            const overlay = document.getElementById('step-modal-overlay');

            overlay.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-95');
            card.classList.add('scale-100');
        }

        function openRelationModal() {
            document.getElementById('modal-badge').innerText = "D2 · D3 · D4";
            document.getElementById('modal-title').innerText = "Control y relación de componentes";

            const card = document.getElementById('step-modal-card');
            card.classList.remove('max-w-xl');
            card.classList.add('max-w-2xl');

            const contentContainer = document.getElementById('modal-content');
            contentContainer.innerHTML = `
                <p class="font-medium text-slate-700 text-xs sm:text-sm">
                    La relación entre D2, D3 y D4 puede controlarse mediante el siguiente registro:
                </p>
                <div class="pt-1">
                    <h4 class="font-bold text-emerald-800 text-xs uppercase tracking-wider mb-2">
                        Diferencias entre los componentes centrales de un 8D
                    </h4>
                    <div class="overflow-x-auto rounded-xl border border-slate-200 shadow-sm">
                        <table class="w-full text-left text-xs border-collapse">
                            <thead>
                                <tr class="bg-emerald-50/80 text-emerald-900 border-b border-emerald-100">
                                    <th class="py-2.5 px-3 font-bold">Elemento</th>
                                    <th class="py-2.5 px-3 font-bold">Definición</th>
                                    <th class="py-2.5 px-3 font-bold">Evidencia</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 text-slate-600">
                                <tr class="hover:bg-slate-50/60 transition-colors">
                                    <td class="py-2 px-3 font-semibold text-slate-800">Problema</td>
                                    <td class="py-2 px-3">Brecha respecto del requisito</td>
                                    <td class="py-2 px-3">Registro de defecto, queja o indicador</td>
                                </tr>
                                <tr class="hover:bg-slate-50/60 transition-colors bg-slate-50/40">
                                    <td class="py-2 px-3 font-semibold text-slate-800">Contención</td>
                                    <td class="py-2 px-3">Protección temporal</td>
                                    <td class="py-2 px-3">Lotes bloqueados, inspección o respaldo</td>
                                </tr>
                                <tr class="hover:bg-slate-50/60 transition-colors">
                                    <td class="py-2 px-3 font-semibold text-slate-800">Causa de ocurrencia</td>
                                    <td class="py-2 px-3">Condición que produce la falla</td>
                                    <td class="py-2 px-3">Prueba de reproducción y eliminación</td>
                                </tr>
                                <tr class="hover:bg-slate-50/60 transition-colors bg-slate-50/40">
                                    <td class="py-2 px-3 font-semibold text-slate-800">Causa de escape</td>
                                    <td class="py-2 px-3">Razón por la que no fue detectada</td>
                                    <td class="py-2 px-3">Evaluación del control</td>
                                </tr>
                                <tr class="hover:bg-slate-50/60 transition-colors">
                                    <td class="py-2 px-3 font-semibold text-slate-800">Acción permanente</td>
                                    <td class="py-2 px-3">Cambio que elimina la causa</td>
                                    <td class="py-2 px-3">Validación antes-después</td>
                                </tr>
                                <tr class="hover:bg-slate-50/60 transition-colors bg-slate-50/40">
                                    <td class="py-2 px-3 font-semibold text-slate-800">Prevención sistémica</td>
                                    <td class="py-2 px-3">Cambio que evita problemas similares</td>
                                    <td class="py-2 px-3">Estándares, AMEF y lecciones aprendidas</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            const overlay = document.getElementById('step-modal-overlay');
            overlay.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-95');
            card.classList.add('scale-100');
        }

        function closeStepModal() {
            const overlay = document.getElementById('step-modal-overlay');
            const card = document.getElementById('step-modal-card');

            card.classList.remove('scale-100');
            card.classList.add('scale-95');
            overlay.classList.add('opacity-0', 'pointer-events-none');
        }

        // Cerrar al dar clic en el fondo oscuro
        document.getElementById('step-modal-overlay').addEventListener('click', (e) => {
            if (e.target.id === 'step-modal-overlay') {
                closeStepModal();
            }
        });
    </script>
</body>
</html>
